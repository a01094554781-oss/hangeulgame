    <style>
      body {
        background-color: #0f0518;
        color: white;
        overscroll-behavior: none;
        overflow-x: hidden;
      }

      /* CRT Scanline Effect */
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        z-index: 50;
      }
      
      .vignette {
        background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        z-index: 51;
      }

      /* Moving Grid Background */
      .perspective-grid {
        position: fixed;
        width: 200%;
        height: 200%;
        top: -50%;
        left: -50%;
        background-image: 
          linear-gradient(to right, rgba(217, 70, 239, 0.1) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(139, 92, 246, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: perspective(500px) rotateX(60deg);
        animation: grid-move 5s linear infinite;
        z-index: -1;
        pointer-events: none;
      }

      /* Neon Text Styles */
      .text-neon-pink {
        text-shadow: 0 0 5px #d946ef, 0 0 10px #d946ef, 0 0 20px #d946ef;
      }
      .text-neon-blue {
        text-shadow: 0 0 5px #22d3ee, 0 0 10px #22d3ee;
      }
      .text-neon-yellow {
        text-shadow: 0 0 5px #facc15, 0 0 10px #facc15;
      }

      /* Glassmorphism Card */
      .glass-card {
        background: rgba(26, 11, 46, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      /* 3D Retro Button */
      .btn-retro {
        position: relative;
        transition: all 0.1s;
        top: 0;
      }
      .btn-retro::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        top: 6px;
        left: 0;
        background-color: rgba(0,0,0,0.3);
        border-radius: inherit;
        z-index: -1;
        transition: all 0.1s;
      }
      .btn-retro:active {
        top: 6px;
      }
      .btn-retro:active::after {
        top: 0;
      }
    </style>

          <div className="w-full max-w-lg mx-auto flex flex-col items-center gap-6 z-10">
            <div className="glass-card rounded-[2rem] p-8 w-full text-center relative overflow-hidden border-2 border-arcade-primary/50 shadow-[0_0_20px_rgba(217,70,239,0.3)]">
              <h2 className="text-arcade-primary font-bold tracking-widest mb-4 uppercase text-lg text-neon-pink">ROUND {round}</h2>
              {loading ? <div className="h-40 flex items-center justify-center"><IconLoader className="text-white w-12 h-12" /></div> : 
              <div className="py-12 bg-black/30 rounded-3xl border border-white/10 mb-6 backdrop-blur-sm">
                  <div className="text-7xl font-display text-white tracking-[0.2em] drop-shadow-[0_0_10px_rgba(255,255,255,0.8)] animate-neon-flicker">{initials}</div>
                  <p className="text-gray-400 text-sm font-bold mt-4 uppercase tracking-wider">Cho-seong Quiz</p>
              </div>}
              {showExamples && <div className="bg-white/10 p-4 rounded-xl border border-white/20 animate-pop mb-6">
                  <h4 className="text-sm font-bold text-arcade-accent mb-3 flex items-center justify-center gap-1"><IconLightbulb /> 정답 예시</h4>
                  <div className="flex flex-wrap justify-center gap-2">{examples.map((ex, idx) => <span key={idx} className="bg-arcade-secondary/80 text-white px-3 py-1 rounded-full text-lg font-display border border-white/20 shadow-lg">{ex}</span>)}</div>
              </div>}
              <div className="grid gap-4">
                  {!showExamples && <Button onClick={() => setShowExamples(true)} variant="secondary" className="w-full" disabled={loading}><IconLightbulb /> 힌트 보기</Button>}
                  <Button onClick={handleNext} variant="primary" className="w-full" disabled={loading}>다음 문제 <IconArrowRight /></Button>
              </div>
            </div>
            <button onClick={() => onGameOver({score: 0})} className="mt-2 text-gray-500 hover:text-white underline text-sm">그만하기</button>
          </div>
        );
      };

      const CategoryGame = ({ onGameOver }) => {
        const [category, setCategory] = useState('');
        const [loading, setLoading] = useState(false);
        const [examples, setExamples] = useState([]);
        const [showExamples, setShowExamples] = useState(false);
        const [round, setRound] = useState(1);

        const loadNew = () => {
          setLoading(true); setShowExamples(false);
          try {
            const { item, newDeck } = getNextItemFromDeck(categoryDeck, CATEGORY_DATA);
            categoryDeck = newDeck;
            setCategory(item.category);
            setExamples(shuffle(item.examples).slice(0, 6));
          } catch(e) { setCategory("과일"); }
          setTimeout(() => setLoading(false), 300);
        };

        useEffect(() => { loadNew(); }, []);
        const handleNext = () => { setRound(p => p + 1); loadNew(); };

        return (
          <div className="w-full max-w-lg mx-auto flex flex-col items-center gap-6 z-10">
            <div className="glass-card rounded-[2rem] p-8 w-full text-center relative overflow-hidden border-2 border-arcade-secondary/50 shadow-[0_0_20px_rgba(139,92,246,0.3)]">
              <h2 className="text-arcade-secondary font-bold tracking-widest mb-4 uppercase text-lg text-neon-blue">ROUND {round}</h2>
              {loading ? <div className="h-40 flex items-center justify-center"><IconLoader className="text-white w-12 h-12" /></div> : 
              <div className="py-12 bg-black/30 rounded-3xl border border-white/10 mb-6 backdrop-blur-sm">
                  <div className="flex justify-center mb-4 text-arcade-secondary"><IconGrid width={40} height={40} /></div>
                  <div className="text-5xl font-display text-white mb-2 drop-shadow-md">{category}</div>
                  <p className="text-gray-400 text-sm font-bold uppercase tracking-wider">Category</p>
              </div>}
              {showExamples && <div className="bg-white/10 p-4 rounded-xl border border-white/20 animate-pop mb-6">
                  <h4 className="text-sm font-bold text-arcade-accent mb-3 flex items-center justify-center gap-1"><IconLightbulb /> 추천 단어</h4>
                  <div className="flex flex-wrap justify-center gap-2">{examples.map((ex, idx) => <span key={idx} className="bg-arcade-secondary/80 text-white px-3 py-1 rounded-full text-lg font-display border border-white/20 shadow-lg">{ex}</span>)}</div>
              </div>}
              <div className="grid gap-4">
                  {!showExamples && <Button onClick={() => setShowExamples(true)} variant="secondary" className="w-full" disabled={loading}><IconLightbulb /> 힌트 보기</Button>}
                  <Button onClick={handleNext} variant="primary" className="w-full" disabled={loading}>다음 문제 <IconArrowRight /></Button>
              </div>
            </div>
            <button onClick={() => onGameOver({score: 0})} className="mt-2 text-gray-500 hover:text-white underline text-sm">그만하기</button>
          </div>
        );
      };

      const SpeedGame = ({ onGameOver }) => {
        const [words, setWords] = useState([]);
        const [currentIndex, setCurrentIndex] = useState(0);
        const [loading, setLoading] = useState(true);
        const [timeLeft, setTimeLeft] = useState(60);
        const [gameActive, setGameActive] = useState(false);
        const [score, setScore] = useState(0);
        const timerRef = useRef(null);

        useEffect(() => {
            setLoading(true);
            try {
                if (speedDeck.length < 10) speedDeck = shuffle(SPEED_WORDS_POOL);
                const selected = speedDeck.splice(0, 10);
                if (selected.length < 10) {
                    speedDeck = shuffle(SPEED_WORDS_POOL);
                    selected.push(...speedDeck.splice(0, 10 - selected.length));
                }
                setWords(selected.map((w, i) => ({...w, id: i})));
                setGameActive(true);
            } catch(e) { setWords([{text: "오류", hint: "다시시도"}]); }
            setLoading(false);
            return () => clearInterval(timerRef.current);
        }, []);

        useEffect(() => {
          if (gameActive && timeLeft > 0) {
              timerRef.current = setInterval(() => {
                  setTimeLeft(prev => { if (prev <= 1) { setGameActive(false); clearInterval(timerRef.current); onGameOver({ score }); return 0; } return prev - 1; });
              }, 1000);
          }
          return () => clearInterval(timerRef.current);
        }, [gameActive]);

        const handleNextWord = () => { if (!gameActive) return; setScore(p => p + 10); nextCard(); };
        const handlePass = () => { if (!gameActive) return; nextCard(); };
        const nextCard = () => { if (currentIndex < words.length - 1) setCurrentIndex(p => p + 1); else setCurrentIndex(0); };

        if (loading) return <div className="flex flex-col items-center justify-center h-64 text-white"><IconLoader className="animate-spin w-12 h-12" /><p className="font-display text-xl animate-pulse mt-4">READY...</p></div>;
        const currentWord = words[currentIndex] || {text: '...', hint: '...'};

        return (
          <div className="w-full max-w-lg mx-auto flex flex-col items-center gap-6 z-10">
            <div className="flex items-center gap-2 bg-arcade-card px-6 py-2 rounded-full font-bold text-xl border-2 border-arcade-accent text-arcade-accent shadow-[0_0_15px_rgba(250,204,21,0.4)]">
               <IconTimer className={`w-6 h-6 ${timeLeft < 10 ? 'animate-pulse text-red-500' : ''}`} /><span>{timeLeft}s</span>
            </div>
            <div className="glass-card rounded-[2.5rem] p-8 w-full text-center relative overflow-hidden border-2 border-arcade-accent/50 shadow-[0_0_30px_rgba(250,204,21,0.2)]">
               <div className="absolute top-0 left-0 w-full h-1 bg-arcade-accent shadow-[0_0_10px_#facc15]"></div>
               <div className="py-8 w-full my-2">
                  <div className="text-7xl font-display text-white mb-6 drop-shadow-[0_5px_5px_rgba(0,0,0,0.5)] animate-pop key={currentWord.text}">{currentWord.text}</div>
                  <div className="text-arcade-bg font-bold text-xl bg-arcade-accent inline-block px-6 py-2 rounded-full shadow-lg">{currentWord.hint}</div>
               </div>
               <p className="text-gray-400 text-xs mt-4 font-bold uppercase tracking-widest">SPEED MODE</p>
            </div>
            <div className="grid grid-cols-2 gap-4 w-full px-2">
               <button onClick={handlePass} className="h-20 rounded-2xl border-2 border-white/20 bg-white/5 text-gray-400 font-display text-2xl hover:bg-white/10 active:scale-95 transition-all flex flex-col items-center justify-center gap-1"><IconX /><span>PASS</span></button>
               <button onClick={handleNextWord} className="h-20 rounded-2xl bg-arcade-success border-b-4 border-green-800 text-green-900 font-display text-3xl hover:bg-green-400 active:border-b-0 active:translate-y-1 transition-all flex flex-col items-center justify-center gap-1 shadow-lg"><IconArrowRight /><span>NEXT</span></button>
            </div>
          </div>
        );
      };

      const App = () => {
        const [currentGame, setCurrentGame] = useState('NONE');
        const [lastStats, setLastStats] = useState(null);

        const startGame = (type) => { setCurrentGame(type); setLastStats(null); };
        const handleGameOver = (stats) => { setLastStats(stats); };
        const resetToMenu = () => { setCurrentGame('NONE'); setLastStats(null); };

        return (
          <div className="min-h-screen font-sans flex flex-col relative">
            <div className="perspective-grid"></div>
            <FloatingElements />
            <div className="scanlines"></div>
            <div className="vignette"></div>
            
            <header className="sticky top-0 z-40 border-b border-white/10 bg-arcade-bg/80 backdrop-blur-md">
              <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-3 cursor-pointer group" onClick={resetToMenu}>
                  <div className="bg-arcade-primary text-white p-2 rounded-xl shadow-[0_0_10px_#d946ef] group-hover:scale-110 transition-transform"><IconCookie /></div>
                  <h1 className="text-xl md:text-2xl font-display text-white tracking-tight mt-1 text-neon-pink">한글과자 아케이드</h1>
                </div>
                {currentGame !== 'NONE' && <button onClick={resetToMenu} className="text-gray-400 hover:text-white transition-colors p-2 bg-white/5 rounded-xl hover:bg-white/10"><IconArrowLeft /></button>}
              </div>
            </header>

            <main className="flex-1 container mx-auto px-4 py-8 flex flex-col items-center justify-start max-w-4xl relative z-10">
              {currentGame === 'NONE' ? (
                <div className="w-full flex flex-col gap-8 animate-pop py-4">
                  <section className="text-center space-y-6 mb-8 mt-4">
                     <div className="inline-block relative">
                        <h2 className="text-5xl md:text-6xl font-display text-white drop-shadow-[0_5px_0_#4c1d95] leading-tight relative z-10">
                           <span className="text-arcade-accent text-neon-yellow">AI</span>와 함께하는<br/>한글 과자 놀이
                        </h2>
                     </div>
                     <p className="text-gray-300 text-xl font-medium bg-black/40 backdrop-blur-sm inline-block px-6 py-2 rounded-full border border-white/10">
                        오늘의 간식은 어떤 단어인가요? 🍪
                     </p>
                  </section>
                  <div className="grid md:grid-cols-3 gap-6">
                    <button onClick={() => startGame('INITIAL')} className="group relative glass-card p-8 rounded-[2rem] transition-all duration-300 hover:bg-arcade-primary/20 hover:-translate-y-2 hover:shadow-[0_0_30px_rgba(217,70,239,0.4)] text-left overflow-hidden h-72 flex flex-col justify-between border-t border-l border-white/20">
                       <div className="absolute -top-6 -right-6 text-arcade-primary/20 group-hover:scale-110 transition-transform duration-500 rotate-12"><IconAlign width={140} height={140} /></div>
                       <div className="bg-arcade-primary/20 w-16 h-16 rounded-2xl flex items-center justify-center text-arcade-primary shadow-inner mb-4 border border-arcade-primary/30"><IconAlign width={32} height={32} /></div>
                       <div className="relative z-10">
                          <h3 className="text-3xl font-display text-white mb-2 text-neon-pink">초성 게임</h3>
                          <p className="text-gray-400 font-medium text-sm leading-snug group-hover:text-white">제시된 자음을 보고<br/>단어를 맞춰보세요.</p>
                       </div>
                    </button>
                    <button onClick={() => startGame('CATEGORY')} className="group relative glass-card p-8 rounded-[2rem] transition-all duration-300 hover:bg-arcade-secondary/20 hover:-translate-y-2 hover:shadow-[0_0_30px_rgba(139,92,246,0.4)] text-left overflow-hidden h-72 flex flex-col justify-between border-t border-l border-white/20">
                       <div className="absolute -top-6 -right-6 text-arcade-secondary/20 group-hover:scale-110 transition-transform duration-500 -rotate-12"><IconGrid width={140} height={140} /></div>
                       <div className="bg-arcade-secondary/20 w-16 h-16 rounded-2xl flex items-center justify-center text-arcade-secondary shadow-inner mb-4 border border-arcade-secondary/30"><IconGrid width={32} height={32} /></div>
                       <div className="relative z-10">
                          <h3 className="text-3xl font-display text-white mb-2 text-neon-blue">카테고리</h3>
                          <p className="text-gray-400 font-medium text-sm leading-snug group-hover:text-white">주제에 딱 맞는<br/>단어를 찾아보세요.</p>
                       </div>
                    </button>
                    <button onClick={() => startGame('SPEED')} className="group relative glass-card p-8 rounded-[2rem] transition-all duration-300 hover:bg-arcade-accent/20 hover:-translate-y-2 hover:shadow-[0_0_30px_rgba(250,204,21,0.4)] text-left overflow-hidden h-72 flex flex-col justify-between border-t border-l border-white/20">
                       <div className="absolute -top-6 -right-6 text-arcade-accent/20 group-hover:scale-110 transition-transform duration-500 rotate-6"><IconZap width={140} height={140} /></div>
                       <div className="bg-arcade-accent/20 w-16 h-16 rounded-2xl flex items-center justify-center text-arcade-accent shadow-inner mb-4 border border-arcade-accent/30"><IconZap width={32} height={32} /></div>
                       <div className="relative z-10">
                          <h3 className="text-3xl font-display text-white mb-2 text-neon-yellow">단어 짓기</h3>
                          <p className="text-gray-400 font-medium text-sm leading-snug group-hover:text-white">누구보다 빠르게!<br/>순발력 테스트.</p>
                       </div>
                    </button>
                  </div>
                </div>
              ) : (
                <div className="w-full flex flex-col items-center">
                   {lastStats ? (
                      <div className="max-w-md w-full glass-card rounded-[2.5rem] shadow-2xl p-8 text-center animate-pop border-2 border-arcade-accent relative mt-10 z-20">
                          <div className="absolute -top-12 left-1/2 transform -translate-x-1/2">
                               <div className="w-24 h-24 bg-arcade-accent rounded-full flex items-center justify-center border-4 border-arcade-bg shadow-[0_0_20px_#facc15] text-arcade-bg animate-bounce-slight"><IconTrophy width={48} height={48} /></div>
                          </div>
                          <h2 className="text-4xl font-display text-white mb-2 mt-10 text-neon-yellow">게임 종료!</h2>
                          <div className="py-6">
                             <span className="text-7xl font-display text-arcade-accent text-outline drop-shadow-lg">{lastStats.score || 0}</span>
                             <span className="text-gray-400 font-bold ml-2">점</span>
                          </div>
                          <p className="text-gray-300 font-medium mb-8">참 잘했어요! 🍪</p>
                          <div className="space-y-4">
                              <Button onClick={() => startGame(currentGame)} variant="success" size="lg" className="w-full shadow-[0_0_15px_rgba(74,222,128,0.5)]">다시 하기</Button>
                              <Button onClick={resetToMenu} variant="secondary" className="w-full">메뉴로 나가기</Button>
                          </div>
                      </div>
                   ) : (
                      <>
                          {currentGame === 'INITIAL' && <InitialGame onGameOver={handleGameOver} />}
                          {currentGame === 'CATEGORY' && <CategoryGame onGameOver={handleGameOver} />}
                          {currentGame === 'SPEED' && <SpeedGame onGameOver={handleGameOver} />}
                      </>
                   )}
                </div>
              )}
            </main>
            <footer className="py-8 text-center text-white/20 text-xs font-display relative z-10"><p>Hangul Cookie Arcade Remake</p></footer>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
