      }

      }

                    <div className="flex flex-wrap justify-center gap-2">
                        {examples.map((ex, idx) => (
                            <span key={idx} className="bg-white text-gray-900 px-3 py-1 rounded-full text-lg font-display border-2 border-theme-black">{ex}</span>
                        ))}
                    </div>
                </div>
              )}

              <div className="grid gap-3">
                  {!showExamples && <Button onClick={() => setShowExamples(true)} variant="secondary" className="w-full" disabled={loading}><IconLightbulb /> 힌트 보기</Button>}
                  <Button onClick={handleNext} variant="primary" className="w-full" disabled={loading}>다음 문제 <IconArrowRight /></Button>
              </div>
            </div>
            <button onClick={() => onGameOver({score: 0})} className="mt-4 text-theme-dark font-bold underline text-lg font-hand hover:text-theme-purple">그만하기</button>
          </div>
        );
      };

      const CategoryGame = ({ difficulty, onGameOver }) => {
        const [category, setCategory] = useState('');
        const [loading, setLoading] = useState(false);
        const [examples, setExamples] = useState([]);
        const [showExamples, setShowExamples] = useState(false);
        const [round, setRound] = useState(1);

        const loadNew = () => {
          setLoading(true); setShowExamples(false);
          generateCategory(difficulty).then(res => {
             setCategory(res);
             generateCategoryExamples(res).then(exs => {
                 setExamples(exs);
                 setLoading(false);
             });
          });
        };

        useEffect(() => { loadNew(); }, []);
        const handleNext = () => { setRound(p => p + 1); loadNew(); };

        return (
          <div className="w-full max-w-lg mx-auto flex flex-col items-center gap-6 z-10 px-4">
            <div className="card-pop p-8 w-full text-center relative overflow-hidden bg-white">
              <h2 className="text-theme-purple font-bold tracking-widest mb-4 uppercase text-lg">문제 {round}</h2>
              
              {loading ? (
                <div className="h-40 flex items-center justify-center">
                    <IconLoader className="text-theme-purple w-12 h-12" />
                </div>
              ) : (
                <div className="py-10 bg-theme-bg rounded-2xl border-2 border-theme-black mb-6 shadow-pop-sm">
                    <div className="flex justify-center mb-4 text-theme-purple"><IconGrid width={40} height={40} /></div>
                    <div className="text-5xl font-display text-gray-900 mb-2">{category}</div>
                    <p className="text-theme-purple text-sm font-bold">주제어 ({difficulty === 'EASY' ? '순한맛' : difficulty === 'MEDIUM' ? '중간맛' : '매운맛'})</p>
                </div>
              )}

              {showExamples && (
                <div className="bg-theme-yellow/20 p-4 rounded-xl border-2 border-theme-black animate-pop mb-6 shadow-pop-sm">
                    <h4 className="text-sm font-bold text-gray-900 mb-3 flex items-center justify-center gap-1"><IconLightbulb /> 추천 단어</h4>
                    <div className="flex flex-wrap justify-center gap-2">
                        {examples.map((ex, idx) => (
                            <span key={idx} className="bg-white text-gray-900 px-3 py-1 rounded-full text-lg font-display border-2 border-theme-black">{ex}</span>
                        ))}
                    </div>
                </div>
              )}

              <div className="grid gap-3">
                  {!showExamples && <Button onClick={() => setShowExamples(true)} variant="secondary" className="w-full" disabled={loading}><IconLightbulb /> 힌트 보기</Button>}
                  <Button onClick={handleNext} variant="primary" className="w-full" disabled={loading}>다음 문제 <IconArrowRight /></Button>
              </div>
            </div>
            <button onClick={() => onGameOver({score: 0})} className="mt-4 text-theme-dark font-bold underline text-lg font-hand hover:text-theme-purple">그만하기</button>
          </div>
        );
      };

      const SpeedGame = ({ difficulty, onGameOver }) => {
        const [words, setWords] = useState([]);
        const [currentIndex, setCurrentIndex] = useState(0);
        const [loading, setLoading] = useState(true);
        const [timeLeft, setTimeLeft] = useState(60);
        const [gameActive, setGameActive] = useState(false);
        const [score, setScore] = useState(0);
        const timerRef = useRef(null);

        useEffect(() => {
            setLoading(true);
            // Fetch words based on difficulty
            fetchSpeedWords(difficulty).then(data => {
                setWords(data);
                setGameActive(true);
                setLoading(false);
            });
            return () => clearInterval(timerRef.current);
        }, []);

        useEffect(() => {
          if (gameActive && timeLeft > 0) {
              timerRef.current = setInterval(() => {
                  setTimeLeft(prev => { if (prev <= 1) { setGameActive(false); clearInterval(timerRef.current); onGameOver({ score }); return 0; } return prev - 1; });
              }, 1000);
          }
          return () => clearInterval(timerRef.current);
        }, [gameActive]);

        const handleNextWord = () => { if (!gameActive) return; setScore(p => p + 10); nextCard(); };
        const handlePass = () => { if (!gameActive) return; nextCard(); };
        const nextCard = () => { 
            if (currentIndex < words.length - 1) {
                setCurrentIndex(p => p + 1); 
            } else {
                setGameActive(false); 
                onGameOver({ score }); 
            }
        };

        if (loading) return <div className="flex flex-col items-center justify-center h-64 text-gray-900"><IconLoader className="animate-spin w-12 h-12" /><p className="font-display text-xl animate-pulse mt-4">준비중...</p></div>;
        const currentWord = words[currentIndex] || {text: '...', hint: '...'};

        return (
          <div className="w-full max-w-lg mx-auto flex flex-col items-center gap-6 z-10 px-4">
            <div className="flex items-center gap-2 bg-theme-black text-theme-yellow px-6 py-2 rounded-full font-bold text-xl border-2 border-theme-black shadow-pop-sm">
               <IconTimer className={`w-6 h-6 ${timeLeft < 10 ? 'animate-pulse text-red-500' : ''}`} /><span>{timeLeft}초</span>
            </div>
            
            <div className="card-pop p-8 w-full text-center relative overflow-hidden bg-white">
               <div className="py-8 w-full my-2">
                  <div className="text-7xl font-display text-gray-900 mb-6 animate-pop key={currentWord.text}">{currentWord.text}</div>
               </div>
               <p className="text-theme-purple/60 text-xs mt-4 font-bold uppercase tracking-widest">
                   SPEED MODE ({difficulty === 'EASY' ? '순한맛' : difficulty === 'MEDIUM' ? '중간맛' : '매운맛'})
               </p>
            </div>

            <div className="grid grid-cols-2 gap-4 w-full">
               <button onClick={handlePass} className="h-20 rounded-2xl border-2 border-theme-black bg-white text-gray-900 font-display text-2xl hover:bg-gray-50 active:scale-95 transition-all flex flex-col items-center justify-center gap-1 shadow-pop-sm"><IconX /><span>패스</span></button>
               <button onClick={handleNextWord} className="h-20 rounded-2xl bg-theme-purple text-white font-display text-3xl hover:bg-violet-600 active:translate-y-1 transition-all flex flex-col items-center justify-center gap-1 shadow-pop-sm border-2 border-theme-black"><IconArrowRight /><span>다시뽑기</span></button>
            </div>
          </div>
        );
      };

      const App = () => {
        const [currentGame, setCurrentGame] = useState('NONE');
        const [difficulty, setDifficulty] = useState('EASY'); // EASY, MEDIUM, HARD
        const [lastStats, setLastStats] = useState(null);

        const startGame = (type) => { setCurrentGame(type); setLastStats(null); };
        const handleGameOver = (stats) => { setLastStats(stats); };
        const resetToMenu = () => { setCurrentGame('NONE'); setLastStats(null); };

        return (
          <div className="min-h-screen font-sans flex flex-col relative">
            <header className="sticky top-0 z-40 border-b-2 border-theme-black bg-white/90 backdrop-blur-md shadow-sm">
              <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-3 cursor-pointer group" onClick={resetToMenu}>
                  <div className="bg-theme-purple text-white p-2 rounded-xl shadow-pop-sm border-2 border-theme-black group-hover:scale-110 transition-transform"><IconCookie /></div>
                  <h1 className="text-xl md:text-2xl font-display text-theme-black tracking-tight mt-1">한글과자 게임</h1>
                </div>
                {currentGame !== 'NONE' && <button onClick={resetToMenu} className="text-theme-dark transition-colors p-2 hover:bg-theme-bg rounded-xl"><IconArrowLeft /></button>}
              </div>
            </header>

            <main className="flex-1 container mx-auto px-4 py-8 flex flex-col items-center justify-start max-w-4xl relative z-10">
              {currentGame === 'NONE' ? (
                <div className="w-full flex flex-col gap-8 animate-pop py-4">
                  <section className="text-center space-y-6 mb-4 mt-2">
                     <div className="inline-block relative">
                        <div className="absolute top-0 right-0 animate-bounce-slight text-theme-purple"><IconCookie width={40} height={40}/></div>
                        <h2 className="text-5xl md:text-7xl font-display text-gray-900 leading-tight relative z-10 drop-shadow-sm">
                           <span className="text-theme-purple">AI</span>와 함께하는<br/>한글 과자 놀이
                        </h2>
                     </div>
                     
                     {/* Difficulty Selector */}
                     <div className="bg-white p-4 rounded-2xl border-2 border-theme-black shadow-pop-sm inline-block">
                        <p className="text-sm font-bold text-gray-500 mb-2">난이도 선택 (DIFFICULTY)</p>
                        <div className="flex gap-2">
                            {['EASY', 'MEDIUM', 'HARD'].map(d => (
                                <button 
                                    key={d}
                                    onClick={() => setDifficulty(d)}
                                    className={`px-4 py-2 rounded-xl font-display text-lg border-2 border-theme-black transition-all
                                    ${difficulty === d 
                                        ? 'bg-theme-yellow text-theme-black shadow-pop-sm transform -translate-y-1' 
                                        : 'bg-gray-100 text-gray-400 hover:bg-white'}
                                    `}
                                >
                                    {d === 'EASY' ? '순한맛' : d === 'MEDIUM' ? '중간맛' : '매운맛'}
                                </button>
                            ))}
                        </div>
                     </div>
                  </section>
                  
                  <div className="grid md:grid-cols-3 gap-6">
                    <button onClick={() => startGame('INITIAL')} className="group card-pop p-8 transition-all duration-300 hover:-translate-y-2 hover:bg-theme-bg text-left overflow-hidden h-64 flex flex-col justify-between">
                       <div className="bg-theme-purple/20 w-16 h-16 rounded-2xl flex items-center justify-center text-theme-purple mb-4 border-2 border-theme-black"><IconAlign width={32} height={32} /></div>
                       <div className="relative z-10">
                          <h3 className="text-3xl font-display text-gray-900 mb-1">초성 게임</h3>
                          <p className="text-gray-600 font-medium text-sm">자음을 보고 단어 맞추기</p>
                       </div>
                    </button>
                    <button onClick={() => startGame('CATEGORY')} className="group card-pop p-8 transition-all duration-300 hover:-translate-y-2 hover:bg-theme-bg text-left overflow-hidden h-64 flex flex-col justify-between">
                       <div className="bg-theme-yellow/20 w-16 h-16 rounded-2xl flex items-center justify-center text-yellow-600 mb-4 border-2 border-theme-black"><IconGrid width={32} height={32} /></div>
                       <div className="relative z-10">
                          <h3 className="text-3xl font-display text-gray-900 mb-1">카테고리</h3>
                          <p className="text-gray-600 font-medium text-sm">주제에 맞는 단어 찾기</p>
                       </div>
                    </button>
                    <button onClick={() => startGame('SPEED')} className="group card-pop p-8 transition-all duration-300 hover:-translate-y-2 hover:bg-theme-bg text-left overflow-hidden h-64 flex flex-col justify-between">
                       <div className="bg-green-100 w-16 h-16 rounded-2xl flex items-center justify-center text-green-600 mb-4 border-2 border-theme-black"><IconZap width={32} height={32} /></div>
                       <div className="relative z-10">
                          <h3 className="text-3xl font-display text-gray-900 mb-1">단어 짓기</h3>
                          <p className="text-gray-600 font-medium text-sm">순발력 테스트!</p>
                       </div>
                    </button>
                  </div>
                </div>
              ) : (
                <div className="w-full flex flex-col items-center">
                   {lastStats ? (
                      <div className="max-w-md w-full card-pop p-8 text-center animate-pop relative mt-10 z-20 bg-white">
                          <div className="absolute -top-12 left-1/2 transform -translate-x-1/2">
                               <div className="w-24 h-24 bg-theme-yellow rounded-full flex items-center justify-center border-4 border-theme-black shadow-pop text-theme-black animate-bounce-slight"><IconTrophy width={48} height={48} /></div>
                          </div>
                          <h2 className="text-4xl font-display text-gray-900 mb-2 mt-10">게임 종료!</h2>
                          <div className="py-6">
                             <span className="text-7xl font-display text-theme-purple drop-shadow-sm">{lastStats.score || 0}</span>
                             <span className="text-gray-500 font-bold ml-2">점</span>
                          </div>
                          <p className="text-gray-700 font-medium mb-8">참 잘했어요! 🍪</p>
                          <div className="space-y-4">
                              <Button onClick={() => startGame(currentGame)} variant="success" size="lg" className="w-full shadow-pop-sm">다시 하기</Button>
                              <Button onClick={resetToMenu} variant="secondary" className="w-full shadow-pop-sm">메뉴로 나가기</Button>
                          </div>
                      </div>
                   ) : (
                      <>
                          {currentGame === 'INITIAL' && <InitialGame difficulty={difficulty} onGameOver={handleGameOver} />}
                          {currentGame === 'CATEGORY' && <CategoryGame difficulty={difficulty} onGameOver={handleGameOver} />}
                          {currentGame === 'SPEED' && <SpeedGame difficulty={difficulty} onGameOver={handleGameOver} />}
                      </>
                   )}
                </div>
              )}
            </main>
            <footer className="py-8 text-center text-gray-400 text-xs font-display relative z-10"><p>Hangul Cookie Arcade Remake</p></footer>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
