              <div className="py-8 bg-brand-50 rounded-3xl border border-brand-100 mb-6">
                  <div className="text-6xl md:text-7xl font-display text-brand-600 tracking-[0.2em]">{initials}</div>
                  <p className="text-brand-900/40 text-sm font-medium mt-4">이 초성으로 단어를 만들어보세요!</p>
              </div>}
              {showExamples && <div className="bg-accent-light/50 p-4 rounded-xl border border-accent animate-pop mb-6">
                  <h4 className="text-sm font-bold text-brand-800 mb-2 flex items-center justify-center gap-1"><Icons.Lightbulb /> 정답 예시</h4>
                  <div className="flex flex-wrap justify-center gap-2">{examples.map((ex, idx) => <span key={idx} className="bg-white text-brand-900 px-3 py-1 rounded-full text-lg font-display shadow-sm border border-brand-100">{ex}</span>)}</div>
              </div>}
              <div className="grid gap-3">
                  {!showExamples && <Button onClick={handleShowExamples} variant="secondary" className="w-full" disabled={loading || loadingExamples}>{loadingExamples ? <Icons.Loader className="w-5 h-5"/> : <Icons.Lightbulb />} 예시 정답 보기</Button>}
                  <Button onClick={handleNext} variant="success" className="w-full" disabled={loading}>다음 문제 <Icons.ArrowRight /></Button>
              </div>
            </div>
            <Button onClick={() => onGameOver({score: 0, correct: 0, wrong: 0})} variant="secondary" className="mt-4 text-sm py-2">그만하기</Button>
          </div>
        );
      };

      const CategoryGame = ({ difficulty, onGameOver }) => {
        const [category, setCategory] = useState('');
        const [loading, setLoading] = useState(false);
        const [examples, setExamples] = useState([]);
        const [showExamples, setShowExamples] = useState(false);
        const [loadingExamples, setLoadingExamples] = useState(false);
        const [round, setRound] = useState(1);

        useEffect(() => { loadCategory(); }, []);

        const loadCategory = async () => {
          setLoading(true); setExamples([]); setShowExamples(false);
          const newCat = await generateCategory(difficulty);
          setCategory(newCat); setLoading(false);
        };

        const handleShowExamples = async () => {
          if (showExamples) return;
          setLoadingExamples(true);
          const exs = await generateCategoryExamples(category);
          setExamples(exs); setShowExamples(true); setLoadingExamples(false);
        };

        const handleNext = () => { setRound(p => p + 1); loadCategory(); };

        return (
          <div className="w-full max-w-lg mx-auto flex flex-col items-center gap-6">
            <div className="bg-white rounded-[2rem] p-8 shadow-xl border-2 border-brand-100 w-full text-center relative overflow-hidden">
              <h2 className="text-brand-400 font-bold tracking-widest mb-4 uppercase">문제 {round}</h2>
              {loading ? <div className="h-40 flex items-center justify-center"><Icons.Loader className="w-10 h-10 text-brand-400" /></div> : 
              <div className="py-8 bg-brand-50 rounded-3xl border border-brand-100 mb-6">
                  <div className="flex justify-center mb-4"><div className="bg-white p-3 rounded-2xl shadow-sm text-brand-500"><Icons.Grid /></div></div>
                  <div className="text-4xl md:text-5xl font-display text-brand-700 mb-2">{category}</div>
                  <p className="text-brand-900/40 text-sm font-medium">이 주제에 맞는 단어를 만들어보세요!</p>
              </div>}
              {showExamples && <div className="bg-accent-light/50 p-4 rounded-xl border border-accent animate-pop mb-6">
                  <h4 className="text-sm font-bold text-brand-800 mb-2 flex items-center justify-center gap-1"><Icons.Lightbulb /> 추천 단어</h4>
                  <div className="flex flex-wrap justify-center gap-2">{examples.map((ex, idx) => <span key={idx} className="bg-white text-brand-900 px-3 py-1 rounded-full text-lg font-display shadow-sm border border-brand-100">{ex}</span>)}</div>
              </div>}
              <div className="grid gap-3">
                  {!showExamples && <Button onClick={handleShowExamples} variant="secondary" className="w-full" disabled={loading || loadingExamples}>{loadingExamples ? <Icons.Loader className="w-5 h-5"/> : <Icons.Lightbulb />} 추천 단어 보기</Button>}
                  <Button onClick={handleNext} variant="success" className="w-full" disabled={loading}>다음 문제 <Icons.ArrowRight /></Button>
              </div>
            </div>
            <Button onClick={() => onGameOver({score: 0, correct: 0, wrong: 0})} variant="secondary" className="mt-4 text-sm py-2">그만하기</Button>
          </div>
        );
      };

      const SpeedGame = ({ difficulty, onGameOver }) => {
        const [words, setWords] = useState([]);
        const [currentIndex, setCurrentIndex] = useState(0);
        const [loading, setLoading] = useState(true);
        const [timeLeft, setTimeLeft] = useState(60);
        const [gameActive, setGameActive] = useState(false);
        const [score, setScore] = useState(0);
        const timerRef = useRef(null);

        useEffect(() => { initGame(); return () => clearInterval(timerRef.current); }, []);
        useEffect(() => {
          if (gameActive && timeLeft > 0) {
              timerRef.current = setInterval(() => {
                  setTimeLeft(prev => { if (prev <= 1) { endGame(); return 0; } return prev - 1; });
              }, 1000);
          }
          return () => clearInterval(timerRef.current);
        }, [gameActive]);

        const initGame = async () => {
          setLoading(true); const data = await fetchSpeedWords(difficulty);
          setWords(data); setLoading(false); setGameActive(true);
        };

        const endGame = () => { setGameActive(false); clearInterval(timerRef.current); onGameOver({ score, correct: score / 10, wrong: 0, streak: 0 }); };
        const handleNextWord = () => { if (!gameActive) return; setScore(p => p + 10); nextCard(); };
        const handlePass = () => { if (!gameActive) return; nextCard(); };
        const nextCard = () => { if (currentIndex < words.length - 1) setCurrentIndex(p => p + 1); else setCurrentIndex(Math.floor(Math.random() * words.length)); };

        if (loading) return <div className="flex flex-col items-center justify-center h-64 text-brand-800"><Icons.Loader className="w-12 h-12 mb-4" /><p className="font-display text-xl animate-pulse text-brand-500">주문서를 가져오는 중...</p></div>;
        const currentWord = words[currentIndex];

        return (
          <div className="w-full max-w-lg mx-auto flex flex-col items-center gap-6">
            <div className="flex items-center gap-2 bg-brand-600 text-white px-6 py-2 rounded-full font-bold text-xl shadow-lg border-2 border-brand-400">
               <Icons.Timer /><span>{timeLeft}초</span>
            </div>
            <div className="w-full bg-white rounded-[2.5rem] p-8 shadow-xl border-4 border-brand-100 text-center relative overflow-hidden flex flex-col items-center min-h-[320px] justify-center">
               <div className="mb-4 flex flex-col items-center"><div className="bg-brand-50 p-4 rounded-full mb-2 shadow-inner"><Icons.Sparkles /></div><div className="text-sm text-brand-300 font-bold tracking-widest uppercase">Make this word</div></div>
               <div className="py-6 w-full my-2"><div className="text-6xl md:text-7xl font-display text-brand-900 mb-4 drop-shadow-sm leading-tight">{currentWord?.text}</div><div className="text-brand-400 font-medium text-lg bg-brand-50 inline-block px-4 py-1 rounded-full">{currentWord?.hint}</div></div>
               <p className="text-brand-900/30 text-xs mt-2 font-medium">빨리 만들고 '다음문제' 버튼을 누르세요!</p>
            </div>
            <div className="grid grid-cols-2 gap-4 w-full px-2">
               <button onClick={handlePass} className="h-20 rounded-2xl border-2 border-brand-100 text-brand-300 font-display text-xl hover:bg-brand-50 active:scale-95 transition-all flex flex-col items-center justify-center gap-1"><Icons.XCircle /><span>패스</span></button>
               <button onClick={handleNextWord} className="h-20 rounded-2xl bg-accent text-brand-900 font-display text-2xl shadow-[0_4px_0_0_#d97706] hover:bg-accent-hover active:shadow-none active:translate-y-[4px] transition-all flex flex-col items-center justify-center gap-1"><Icons.ArrowRight /><span>다음문제</span></button>
            </div>
          </div>
        );
      };

      // --- APP ---
      const App = () => {
        const [currentGame, setCurrentGame] = useState(GameType.NONE);
        const [difficulty, setDifficulty] = useState(Difficulty.EASY);
        const [lastStats, setLastStats] = useState(null);

        const startGame = (type) => { setCurrentGame(type); setLastStats(null); };
        const handleGameOver = (stats) => { setLastStats(stats); };
        const resetToMenu = () => { setCurrentGame(GameType.NONE); setLastStats(null); };

        return (
          <div className="min-h-screen font-sans text-gray-800 flex flex-col bg-brand-50 selection:bg-brand-200">
            <header className="bg-white/80 backdrop-blur-md sticky top-0 z-20 border-b border-brand-100 shadow-sm">
              <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-3 cursor-pointer group" onClick={resetToMenu}>
                  <div className="bg-brand-500 text-white p-2 rounded-xl shadow-md group-hover:scale-110 transition-transform"><Icons.Cookie /></div>
                  <h1 className="text-xl md:text-2xl font-display text-brand-900 tracking-tight mt-1">한글과자 아케이드</h1>
                </div>
                {currentGame !== GameType.NONE && <button onClick={resetToMenu} className="text-brand-400 hover:text-brand-600 transition-colors p-2 bg-brand-50 rounded-xl hover:bg-brand-100"><Icons.ArrowLeft /></button>}
              </div>
            </header>

            <main className="flex-1 container mx-auto px-4 py-8 flex flex-col items-center justify-start max-w-4xl">
              {currentGame === GameType.NONE ? (
                <div className="w-full flex flex-col gap-8 animate-pop py-4">
                  <section className="text-center space-y-4 mb-4">
                     <h2 className="text-4xl md:text-5xl font-display text-brand-900 drop-shadow-sm leading-tight"><span className="text-brand-500">AI</span>와 함께하는<br/>한글 과자 놀이</h2>
                     <p className="text-brand-800/60 text-lg font-medium">문제를 내드릴게요, 과자로 맞춰보세요!</p>
                  </section>
                  <div className="bg-white p-6 rounded-[2rem] border border-brand-100 shadow-sm">
                      <label className="flex items-center gap-2 text-sm font-bold text-brand-400 mb-4 uppercase tracking-wider justify-center"><Icons.Sparkles /> 난이도 선택 (Difficulty)</label>
                      <div className="grid grid-cols-3 gap-3 md:gap-6">
                          {[{ id: Difficulty.EASY, label: '순한맛', desc: '초급', color: 'bg-green-100 text-green-700 ring-green-200' },
                            { id: Difficulty.MEDIUM, label: '중간맛', desc: '중급', color: 'bg-yellow-100 text-yellow-700 ring-yellow-200' },
                            { id: Difficulty.HARD, label: '매운맛', desc: '고급', color: 'bg-red-100 text-red-700 ring-red-200' }].map(d => (
                                  <button key={d.id} onClick={() => setDifficulty(d.id)} className={`relative px-2 py-4 md:px-6 rounded-2xl border-2 text-center transition-all active:scale-95 ${difficulty === d.id ? `${d.color} ring-2 ring-offset-2 border-transparent shadow-md font-bold` : 'bg-gray-50 text-gray-400 border-gray-100 hover:bg-white hover:border-brand-200'}`}>
                                  <div className="font-display text-lg md:text-xl mb-1">{d.label}</div>
                                  <div className="text-xs opacity-80 hidden md:block">{d.desc}</div>
                                  {difficulty === d.id && <div className="absolute -top-2 -right-2 bg-white rounded-full p-1 shadow-sm text-brand-500"><Icons.Star /></div>}
                                  </button>
                          ))}
                      </div>
                  </div>
                  <div className="grid md:grid-cols-3 gap-4">
                    <button onClick={() => startGame(GameType.INITIAL)} className="group relative bg-brand-100 hover:bg-brand-200 p-6 rounded-[2rem] transition-all duration-300 border-2 border-brand-200 hover:border-brand-300 active:scale-95 text-left overflow-hidden shadow-sm h-64 flex flex-col justify-between">
                       <div className="absolute -top-4 -right-4 text-brand-300/30 group-hover:scale-110 transition-transform duration-500 rotate-12"><Icons.Align /></div>
                       <div className="bg-white w-12 h-12 rounded-2xl flex items-center justify-center text-brand-600 shadow-sm"><Icons.Align /></div>
                       <div className="relative z-10"><h3 className="text-2xl font-display text-brand-900 mb-1">초성 게임</h3><p className="text-brand-800/80 font-medium text-sm leading-snug">제시된 초성을 보고<br/>단어를 만들어보세요.</p></div>
                    </button>
                    <button onClick={() => startGame(GameType.CATEGORY)} className="group relative bg-violet-100 hover:bg-violet-200 p-6 rounded-[2rem] transition-all duration-300 border-2 border-violet-200 hover:border-violet-300 active:scale-95 text-left overflow-hidden shadow-sm h-64 flex flex-col justify-between">
                       <div className="absolute -top-4 -right-4 text-violet-300/30 group-hover:scale-110 transition-transform duration-500 -rotate-12"><Icons.Grid /></div>
                       <div className="bg-white w-12 h-12 rounded-2xl flex items-center justify-center text-violet-600 shadow-sm"><Icons.Grid /></div>
                       <div className="relative z-10"><h3 className="text-2xl font-display text-violet-900 mb-1">카테고리</h3><p className="text-violet-900/80 font-medium text-sm leading-snug">주제에 맞는<br/>단어를 찾아보세요.</p></div>
                    </button>
                    <button onClick={() => startGame(GameType.SPEED)} className="group relative bg-accent/30 hover:bg-accent/50 p-6 rounded-[2rem] transition-all duration-300 border-2 border-accent hover:border-accent-hover active:scale-95 text-left overflow-hidden shadow-sm h-64 flex flex-col justify-between">
                       <div className="absolute -top-4 -right-4 text-accent/30 group-hover:scale-110 transition-transform duration-500 rotate-6"><Icons.Zap /></div>
                       <div className="bg-white w-12 h-12 rounded-2xl flex items-center justify-center text-yellow-600 shadow-sm"><Icons.Zap /></div>
                       <div className="relative z-10"><h3 className="text-2xl font-display text-brand-900 mb-1">단어 짓기</h3><p className="text-brand-900/80 font-medium text-sm leading-snug">제시된 단어를<br/>누구보다 빠르게!</p></div>
                    </button>
                  </div>
                </div>
              ) : (
                <div className="w-full flex flex-col items-center">
                   {lastStats ? (
                      <div className="max-w-md w-full bg-white rounded-[2.5rem] shadow-xl p-8 text-center animate-pop border-4 border-brand-100 relative mt-10">
                          <div className="absolute -top-12 left-1/2 transform -translate-x-1/2">
                               <div className="w-24 h-24 bg-accent rounded-full flex items-center justify-center border-4 border-white shadow-lg text-brand-900 animate-bounce-slight"><Icons.Trophy /></div>
                          </div>
                          <h2 className="text-3xl font-display text-gray-800 mb-2 mt-10">게임 종료!</h2>
                          <p className="text-gray-400 font-medium mb-8">재미있게 놀았나요?</p>
                          <div className="space-y-3">
                              <Button onClick={() => startGame(currentGame)} variant="success" className="w-full shadow-lg shadow-accent/20">다시 하기</Button>
                              <Button onClick={resetToMenu} variant="secondary" className="w-full">메뉴로 나가기</Button>
                          </div>
                      </div>
                   ) : (
                      <>
                          <div className="mb-6 flex items-center gap-2 px-4 py-1.5 bg-white/80 backdrop-blur-sm rounded-full shadow-sm border border-brand-100 text-xs font-bold text-brand-800 uppercase tracking-wide">
                               <span className={`w-2 h-2 rounded-full ${difficulty === Difficulty.EASY ? 'bg-green-500' : difficulty === Difficulty.MEDIUM ? 'bg-yellow-500' : 'bg-red-500'}`}></span>
                              <span>{difficulty === Difficulty.EASY ? '순한맛 (Easy)' : difficulty === Difficulty.MEDIUM ? '중간맛 (Medium)' : '매운맛 (Hard)'}</span>
                          </div>
                          {currentGame === GameType.INITIAL && <InitialGame difficulty={difficulty} onGameOver={handleGameOver} onBack={resetToMenu} />}
                          {currentGame === GameType.CATEGORY && <CategoryGame difficulty={difficulty} onGameOver={handleGameOver} />}
                          {currentGame === GameType.SPEED && <SpeedGame difficulty={difficulty} onGameOver={handleGameOver} />}
                      </>
                   )}
                </div>
              )}
            </main>
            <footer className="py-8 text-center text-brand-900/20 text-sm font-display"><p>Hangul Cookie Arcade Remake</p></footer>
          </div>
        );
      };

      // --- MOUNT ---
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
