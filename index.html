              theme: {

                light: '#DDD6FE',   // 연한 보라 장식
              }

              'pop': 'pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
              'float': 'float 3s ease-in-out infinite',
              'wiggle': 'wiggle 2s ease-in-out infinite',
            },
            keyframes: {
              'pop': { '0%': { transform: 'scale(0.5)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
              'float': { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
              'wiggle': { '0%, 100%': { transform: 'rotate(-3deg)' }, '50%': { transform: 'rotate(3deg)' } },
            },
            boxShadow: {
              'hard': '4px 4px 0px 0px #18181B', // 만화 같은 검정 그림자

    <style>
      body {
        background-color: #F5F3FF;
        color: #18181B;
        overscroll-behavior: none;
        min-height: 100vh;
        min-height: 100dvh;
      }
      
      /* Dot Pattern Background */
      .bg-pattern {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: radial-gradient(#DDD6FE 2px, transparent 2px);
        background-size: 20px 20px;
        z-index: -1;
      }

      /* Pop Art Card */
      .pop-card {
        background: white;
        border: 3px solid #18181B;
        border-radius: 20px;
        box-shadow: 6px 6px 0px #18181B; /* 검정 그림자 */
      }

      /* Pop Button */
      .btn-pop {
        border: 3px solid #18181B;
        transition: all 0.1s;
        transform: translate(0, 0);
        box-shadow: 4px 4px 0px #18181B;
        font-weight: 700;
      }
      .btn-pop:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px #18181B;
      }

      /* Loading Overlay */
      #loading-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #F5F3FF; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; font-family: 'Jua', sans-serif; color: #8B5CF6;
      }
    </style>

        return false;
      };
    </script>

          return () => clearInterval(timerRef.current);
        }, [gameActive]);

        const handleNextWord = () => { if (!gameActive) return; setScore(p => p + 10); nextCard(); };
        const handlePass = () => { if (!gameActive) return; nextCard(); };
        const nextCard = () => { if (currentIndex < words.length - 1) setCurrentIndex(p => p + 1); else setCurrentIndex(0); };

        if (loading) return <div className="flex flex-col items-center justify-center h-64 text-theme-dark"><IconLoader className="animate-spin w-12 h-12" /><p className="font-display text-xl animate-pulse mt-4">준비중...</p></div>;
        const currentWord = words[currentIndex] || {text: '...', hint: '...'};

        return (
          <div className="w-full max-w-lg mx-auto flex flex-col items-center gap-6 z-10 px-4">
            <div className="flex items-center gap-2 bg-theme-black text-theme-yellow px-6 py-2 rounded-full font-bold text-xl border-2 border-theme-black shadow-hard-sm">
               <IconTimer className={`w-6 h-6 ${timeLeft < 10 ? 'animate-pulse text-red-500' : ''}`} /><span>{timeLeft}초</span>
            </div>
            <div className="pop-card p-8 w-full text-center relative overflow-hidden">
               <div className="py-8 w-full my-2">
                  <div className="text-7xl font-display text-theme-dark mb-6 animate-pop key={currentWord.text}">{currentWord.text}</div>
                  <div className="text-theme-black font-bold text-xl bg-theme-yellow inline-block px-6 py-2 rounded-lg border-2 border-theme-black shadow-hard-sm">{currentWord.hint}</div>
               </div>
               <p className="text-theme-purple/60 text-xs mt-4 font-bold uppercase tracking-widest">SPEED MODE</p>
            </div>
            <div className="grid grid-cols-2 gap-4 w-full">
               <button onClick={handlePass} className="h-20 rounded-2xl border-2 border-theme-black bg-white text-theme-black font-display text-2xl hover:bg-gray-50 active:scale-95 transition-all flex flex-col items-center justify-center gap-1 shadow-hard-sm"><IconX /><span>패스</span></button>
               <button onClick={handleNextWord} className="h-20 rounded-2xl bg-theme-purple text-white font-display text-3xl hover:bg-violet-600 active:translate-y-1 transition-all flex flex-col items-center justify-center gap-1 shadow-hard-sm border-2 border-theme-black"><IconArrowRight /><span>정답!</span></button>
            </div>
          </div>
        );
      };

      const App = () => {
        const [currentGame, setCurrentGame] = useState('NONE');
        const [lastStats, setLastStats] = useState(null);

        const startGame = (type) => { setCurrentGame(type); setLastStats(null); };
        const handleGameOver = (stats) => { setLastStats(stats); };
        const resetToMenu = () => { setCurrentGame('NONE'); setLastStats(null); };

        return (
          <div className="min-h-screen font-sans flex flex-col relative">
            <header className="sticky top-0 z-40 border-b-2 border-theme-black bg-white/90 backdrop-blur-md shadow-sm">
              <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-3 cursor-pointer group" onClick={resetToMenu}>
                  <div className="bg-theme-purple text-white p-2 rounded-xl shadow-hard-sm border-2 border-theme-black group-hover:scale-110 transition-transform"><IconCookie /></div>
                  <h1 className="text-xl md:text-2xl font-display text-theme-black tracking-tight mt-1">한글과자 아케이드</h1>
                </div>
                {currentGame !== 'NONE' && <button onClick={resetToMenu} className="text-theme-dark transition-colors p-2 hover:bg-theme-bg rounded-xl"><IconArrowLeft /></button>}
              </div>
            </header>

            <main className="flex-1 container mx-auto px-4 py-8 flex flex-col items-center justify-start max-w-4xl relative z-10">
              {currentGame === 'NONE' ? (
                <div className="w-full flex flex-col gap-8 animate-pop py-4">
                  <section className="text-center space-y-6 mb-4 mt-2">
                     <div className="inline-block relative">
                        <div className="absolute top-0 right-0 animate-float text-theme-purple"><IconCookie width={40} height={40}/></div>
                        <h2 className="text-5xl md:text-7xl font-display text-theme-dark leading-tight relative z-10 drop-shadow-sm">
                           <span className="text-theme-purple">AI</span>와 함께하는<br/>한글 과자 놀이
                        </h2>
                     </div>
                     <p className="text-theme-dark text-xl font-hand bg-white inline-block px-6 py-2 rounded-full border-2 border-theme-black shadow-hard-sm">
                        오늘의 간식은 어떤 단어인가요? 🍪
                     </p>
                  </section>
                  <div className="grid md:grid-cols-3 gap-6">
                    <button onClick={() => startGame('INITIAL')} className="group pop-card p-8 transition-all duration-300 hover:-translate-y-2 hover:bg-theme-bg text-left overflow-hidden h-64 flex flex-col justify-between">
                       <div className="bg-theme-purple/20 w-16 h-16 rounded-2xl flex items-center justify-center text-theme-purple mb-4 border-2 border-theme-black"><IconAlign width={32} height={32} /></div>
                       <div className="relative z-10">
                          <h3 className="text-3xl font-display text-theme-dark mb-1">초성 게임</h3>
                          <p className="text-theme-dark/70 font-medium text-sm">자음을 보고 단어 맞추기</p>
                       </div>
                    </button>
                    <button onClick={() => startGame('CATEGORY')} className="group pop-card p-8 transition-all duration-300 hover:-translate-y-2 hover:bg-theme-bg text-left overflow-hidden h-64 flex flex-col justify-between">
                       <div className="bg-theme-yellow/20 w-16 h-16 rounded-2xl flex items-center justify-center text-yellow-600 mb-4 border-2 border-theme-black"><IconGrid width={32} height={32} /></div>
                       <div className="relative z-10">
                          <h3 className="text-3xl font-display text-theme-dark mb-1">카테고리</h3>
                          <p className="text-theme-dark/70 font-medium text-sm">주제에 맞는 단어 찾기</p>
                       </div>
                    </button>
                    <button onClick={() => startGame('SPEED')} className="group pop-card p-8 transition-all duration-300 hover:-translate-y-2 hover:bg-theme-bg text-left overflow-hidden h-64 flex flex-col justify-between">
                       <div className="bg-green-100 w-16 h-16 rounded-2xl flex items-center justify-center text-green-600 mb-4 border-2 border-theme-black"><IconZap width={32} height={32} /></div>
                       <div className="relative z-10">
                          <h3 className="text-3xl font-display text-theme-dark mb-1">단어 짓기</h3>
                          <p className="text-theme-dark/70 font-medium text-sm">순발력 테스트!</p>
                       </div>
                    </button>
                  </div>
                </div>
              ) : (
                <div className="w-full flex flex-col items-center">
                   {lastStats ? (
                      <div className="max-w-md w-full pop-card p-8 text-center animate-pop relative mt-10 z-20">
                          <div className="absolute -top-12 left-1/2 transform -translate-x-1/2">
                               <div className="w-24 h-24 bg-theme-yellow rounded-full flex items-center justify-center border-4 border-theme-black shadow-hard text-theme-black animate-bounce-slight"><IconTrophy width={48} height={48} /></div>
                          </div>
                          <h2 className="text-4xl font-display text-theme-dark mb-2 mt-10">게임 종료!</h2>
                          <div className="py-6">
                             <span className="text-7xl font-display text-theme-purple drop-shadow-sm">{lastStats.score || 0}</span>
                             <span className="text-theme-dark/60 font-bold ml-2">점</span>
                          </div>
                          <p className="text-theme-dark/80 font-medium mb-8">참 잘했어요! 🍪</p>
                          <div className="space-y-4">
                              <Button onClick={() => startGame(currentGame)} variant="success" size="lg" className="w-full shadow-hard-sm">다시 하기</Button>
                              <Button onClick={resetToMenu} variant="secondary" className="w-full shadow-hard-sm">메뉴로 나가기</Button>
                          </div>
                      </div>
                   ) : (
                      <>
                          {currentGame === 'INITIAL' && <InitialGame onGameOver={handleGameOver} />}
                          {currentGame === 'CATEGORY' && <CategoryGame onGameOver={handleGameOver} />}
                          {currentGame === 'SPEED' && <SpeedGame onGameOver={handleGameOver} />}
                      </>
                   )}
                </div>
              )}
            </main>
            <footer className="py-8 text-center text-theme-dark/30 text-xs font-display relative z-10"><p>Hangul Cookie Arcade Remake</p></footer>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
